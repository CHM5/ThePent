<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Menú Base</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
    th { background: #eee; }
    .fijos { margin-bottom: 20px; color: #444; }
  </style>
</head>
<body>
  <h1>Menú Base</h1>
  <p>Este menú está conectado a <a href="https://docs.google.com/spreadsheets/d/1ih4E55HB4auHG__oUYb7hPpnGWa7kQgy16vJg_sd364/edit" target="_blank">esta planilla</a> y se actualiza automáticamente.</p>

  <div class="fijos">
    <strong>Datos Fijos:</strong>
    <ul>
      <li>Link</li>
    </ul>
  </div>

  <table id="menuTable">
    <thead>
      <tr>
        <th>Categoría</th>
        <th>Subcategoría</th>
        <th>Nombre</th>
        <th>Descripción</th>
        <th>Precio</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/1ih4E55HB4auHG__oUYb7hPpnGWa7kQgy16vJg_sd364/gviz/tq?tqx=out:csv";

    fetch(CSV_URL)
      .then(response => response.text())
      .then(data => {
        const rows = data.split("\n").slice(1, 26);
        const tbody = document.querySelector("#menuTable tbody");

        rows.forEach(row => {
          const cols = row.split(",").map(col => col.replace(/"/g, ""));
          if (cols.length >= 5 && cols.some(cell => cell.trim() !== "")) {
            const tr = document.createElement("tr");
            cols.slice(0, 5).forEach(cell => {
              const td = document.createElement("td");
              td.textContent = cell;
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          }
        });
      })
      .catch(err => {
        console.error("Error al cargar el CSV:", err);
      });
  </script>
</body>
</html>
