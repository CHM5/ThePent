name: Plan Base

on:
  repository_dispatch:
    types: [nuevo_cliente]

jobs:
  generar-menu-base:
    runs-on: ubuntu-latest

    steps:
      # 0) Checkout
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      # 1) Variables del dispatch
      - name: Extraer info del cliente
        id: vars
        run: |
          echo "nombre=${{ github.event.client_payload.nombre }}" >> $GITHUB_OUTPUT
          echo "apellido=${{ github.event.client_payload.apellido }}" >> $GITHUB_OUTPUT
          echo "negocio=${{ github.event.client_payload.negocio }}" >> $GITHUB_OUTPUT
          echo "email=${{ github.event.client_payload.email }}" >> $GITHUB_OUTPUT
          echo "plan=${{ github.event.client_payload.plan }}" >> $GITHUB_OUTPUT

      # 2) Python + deps
      - uses: actions/setup-python@v4
        with: 
          python-version: '3.11'

      - run: pip install google-api-python-client google-auth

      # 3) Ejecutar script de generación
      - name: Ejecutar script de generación
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          CLIENT_EMAIL: ${{ github.event.client_payload.email }}  # <-- Aquí está el valor del email
        run: python scripts/generar_sitio.py

      # 4) Capturar URLs que generó el script
      - name: Capturar rutas generadas
        id: paths
        run: |
          echo "menu_url=$(cat menu_url.txt)" >> $GITHUB_OUTPUT
          echo "sheet_url=$(cat sheet_url.txt)" >> $GITHUB_OUTPUT

      # 5) Commit + push
      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Commit y push del sitio generado (SSH)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add planes/
          git commit -m "Menú ${{ steps.vars.outputs.negocio }}" || echo "Nada para commitear"
          git remote set-url origin git@github.com:CHM5/ThePent.git
          git pull --rebase origin main
          git push origin HEAD:main

      # 6) Enviar e‑mail al cliente
      - name: Send e‑mail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port:    ${{ secrets.SMTP_PORT }}
          username:       ${{ secrets.SMTP_USER }}
          password:       ${{ secrets.SMTP_PASS }}
          subject: "Tu menú online está listo 🎉"
          to: ${{ steps.vars.outputs.email }}
          from: "The Pent <${{ secrets.SMTP_USER }}>"
          content_type: text/html
          body: |
            ¡Hola ${{ steps.vars.outputs.nombre }}!<br><br>
            Aquí tenés tu menú online:<br>
            <a href="https://chm5.github.io/ThePent/${{ steps.paths.outputs.menu_url }}">Ver menú</a><br><br>
            Podés editar los platos desde esta planilla:<br>
            <a href="${{ steps.paths.outputs.sheet_url }}">Abrir Google Sheet</a><br><br>
            ¡Gracias por elegirnos!<br>
            — Equipo The Pent
