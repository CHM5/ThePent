name: Plan Base

on:
  workflow_dispatch:  # Se puede ejecutar manualmente desde GitHub Actions

jobs:
  generar-menu-base:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v3

      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install google-api-python-client google-auth

      - name: Ejecutar script de generación
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python scripts/generar_sitio.py

      - name: Configurar clave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
      
      - name: Commit y push del sitio generado (SSH)
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add planes/
          git commit -m "Sitio generado - Plan Base" || echo "Nada para commitear"
          git remote set-url origin git@github.com:CHM5/ThePent.git
          git pull --rebase origin main
          git push origin HEAD:main

