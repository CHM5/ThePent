<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bar Modelo - The Pent</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Arial', sans-serif;
      background-color: #f8f9fa;
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 2rem;
      color: #111;
      text-align: center;
    }

    form {
      background-color: #fff;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 500px;
    }

    .plato {
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
    }

    .plato label {
      margin-left: 0.5rem;
      font-size: 1rem;
      color: #333;
    }

    button {
      margin-top: 2rem;
      width: 100%;
      padding: 1rem;
      background-color: #0d6efd;
      color: #fff;
      font-size: 1.2rem;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #0b5ed7;
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      form {
        padding: 1.5rem;
      }

      button {
        font-size: 1rem;
      }
    }
  </style>
</head>

<body>

  <h1>Bar Modelo - Hacer Pedido</h1>

  <form id="pedido-form">
    <div class="plato">
      <input type="checkbox" id="plato1" value="Pizza Margherita">
      <label for="plato1">Pizza Margherita</label>
    </div>

    <div class="plato">
      <input type="checkbox" id="plato2" value="Hamburguesa Completa">
      <label for="plato2">Hamburguesa Completa</label>
    </div>

    <div class="plato">
      <input type="checkbox" id="plato3" value="Ensalada César">
      <label for="plato3">Ensalada César</label>
    </div>

    <div class="plato">
      <input type="checkbox" id="plato4" value="Empanadas de Carne">
      <label for="plato4">Empanadas de Carne</label>
    </div>

    <div class="plato">
      <input type="checkbox" id="plato5" value="Tarta de Verduras">
      <label for="plato5">Tarta de Verduras</label>
    </div>

    <button type="button" onclick="enviarPedido()">Hacer Pedido</button>
  </form>

  <script>
    function enviarPedido() {
      const platosSeleccionados = [];
      const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');

      checkboxes.forEach(cb => {
        platosSeleccionados.push(cb.value);
      });

      if (platosSeleccionados.length === 0) {
        alert('Por favor, seleccioná al menos un plato.');
        return;
      }

      const mensaje = `Hola! Quisiera pedir:\n- ${platosSeleccionados.join('\n- ')}`;
      const mensajeCodificado = encodeURIComponent(mensaje);
      const numeroWhatsApp = '5491163057807'; // Tu número de WhatsApp

      window.open(`https://wa.me/${numeroWhatsApp}?text=${mensajeCodificado}`, '_blank');
    }
  </script>

</body>
</html>
