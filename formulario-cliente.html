<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contratar plan Base</title>
  <style>
    body{font-family:sans-serif;max-width:600px;margin:auto;padding:20px}
    input,button{display:block;width:100%;margin-top:12px;padding:10px}
  </style>
</head>
<body>
  <h1>Crear menú Base</h1>

  <!--  target="oculto" evita que se abra la respuesta "OK" en pantalla  -->
  <form action="https://script.google.com/macros/s/AKfycbxMmFvkFeBpAUZCrUlxVA9vKoaUduhFzliTpJCThozZm_lGCl8FPk5QX-LnwApFEA8V/exec"
        method="POST" target="oculto">
    <input name="nombre"   placeholder="Nombre"            required>
    <input name="apellido" placeholder="Apellido"          required>
    <input name="negocio"  placeholder="Nombre del negocio" required>
    <input name="email"    type="email" placeholder="Email" required>
    <input type="hidden" name="plan" value="0">
    <button>Crear menú</button>
    <!-- iframe oculto -->
    <iframe name="oculto" style="display:none"></iframe>
  </form>

  <p>Al hacer clic en <em>Crear menú</em>, se guardará la información en nuestro Google Sheet.</p>
</body>
</html>
