<!--
  Este es un formulario HTML para contratar un plan de menú digital.
  Incluye campos para datos personales y detalles del negocio.
  Al enviar el formulario, se envían los datos a un Google Sheet.
  Dependiendo del plan seleccionado, se redirige a una página de pago.
  -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Contratar plan Base</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }
    input, button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 10px;
    }
    #mensajeFinal {
      display: none;
      font-size: 1.2em;
      text-align: center;
      padding: 20px;
      border: 2px solid green;
      background-color: #e6ffe6;
    }
    h1, h2 {
      text-align: center;
      color: #333;
    }
    ul {
      margin-top: 0;
      padding-left: 20px;
    }
    button {
      background-color: #0066cc;
      color: white;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background-color: #004999;
    }
  </style>
</head>
<body>

<div id="info-plan" style="border: 1px solid #ccc; padding: 16px; background-color: #f9f9f9; margin-bottom: 20px;"></div>

<div id="contenido">
  <h1>Crear menú Base</h1>

  <form id="formulario">
    <input name="nombre" placeholder="* Nombre" required>
    <input name="apellido" placeholder="* Apellido" required>
    <input name="telefono" placeholder="* Teléfono de contacto" required>
    <input name="email" type="email" placeholder="* Email" required>

    <p>Datos opcionales para la creación del menú web</p>
    <input name="negocio" placeholder="Nombre del negocio">
    <input name="whatsapp" placeholder="Whatsapp del negocio">
    <input name="direccion" placeholder="Dirección del negocio">
    <input name="ciudad" placeholder="Ciudad">
    <input name="provincia" placeholder="Provincia">
    <input name="codigo" placeholder="Código postal">
    <select name="pais">
      <option value="">Seleccionar país</option>
      <option value="Argentina">Argentina</option>
      <option value="Uruguay">Uruguay</option>
      <option value="Chile">Chile</option>
      <option value="Bolivia">Bolivia</option>
      <option value="Colombia">Colombia</option>
      <option value="Costa Rica">Costa Rica</option>
      <option value="Cuba">Cuba</option>
      <option value="Ecuador">Ecuador</option>
      <option value="El Salvador">El Salvador</option>
      <option value="España">España</option>
      <option value="Guatemala">Guatemala</option>
      <option value="Honduras">Honduras</option>
      <option value="México">México</option>
      <option value="Nicaragua">Nicaragua</option>
      <option value="Panamá">Panamá</option>
      <option value="Paraguay">Paraguay</option>
      <option value="Perú">Perú</option>
      <option value="República Dominicana">República Dominicana</option>
      <option value="Venezuela">Venezuela</option>
      <option value="Estados Unidos">Estados Unidos</option>
      <option value="Canadá">Canadá</option>
    </select>
    <input name="web" placeholder="Página web">
    <input name="facebook" placeholder="Facebook">
    <input name="instagram" placeholder="Instagram">

    <button type="button" id="btn-crear-menu">Crear menú INTERACTIVO WEB</button>
  </form>

  <p>Al hacer clic se guardará tu información en nuestro Google Sheet.</p>
</div>

<div id="mensajeFinal">
  ✅ ¡¡¡Felicitaciones!!!<br><br>
  Se ha enviado toda la información a tu email para comenzar a disfrutar tu Carta Web Interactiva.<br><br>The Pent - diseños de altura
  <a href="https://thepent.com.ar" style="
    background-color: #0066cc;
    color: white;
    padding: 10px 20px;
    text-decoration: none;
    font-weight: bold;
    border-radius: 6px;
    display: inline-block;
  ">Volver al sitio</a>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  const plan = parseInt(urlParams.get("plan")) || 0;

  const planInfo = {
    0: { nombre: "Plan Base", detalles: ["Menú digital responsive", "Formulario de contacto", "Soporte por email"] },
    1: { nombre: "Plan Emprendedor", detalles: ["Todo lo del Base", "Botón WhatsApp", "Colores y logo"] },
    2: { nombre: "Plan Profesional", detalles: ["Todo lo anterior", "Estadísticas", "Edición web"] },
    3: { nombre: "Plan Corporativo", detalles: ["Todo completo", "Atención personalizada", "Múltiples usuarios"] }
  };

  const info = planInfo[plan];
  const contenedor = document.getElementById("info-plan");

  if (info) {
    document.title = "Contratar " + info.nombre;
    document.querySelector("h1").textContent = "Crear menú " + info.nombre;
    document.getElementById("btn-crear-menu").textContent = "Crear menú " + info.nombre;
    contenedor.innerHTML = `
      <h2>${info.nombre}</h2>
      <p>Este plan incluye:</p>
      <ul>${info.detalles.map(d => `<li>${d}</li>`).join("")}</ul>
    `;
  }

  document.getElementById('btn-crear-menu').addEventListener('click', async () => {
    const form = document.getElementById('formulario');

    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    const formData = new FormData(form);
    formData.append('plan', plan);

    if (plan === 0) {
      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbzxrjlRDwP_GxVO7IrzVpLvEEJV93xUTtq6lKUp3-XLjX5ViLMnMwGc3dPMDYdltx57/exec", {
          method: "POST",
          body: formData
        });

        const text = await response.text();
        if (text.includes("OK")) {
          document.getElementById("contenido").style.display = "none";
          document.getElementById("mensajeFinal").style.display = "block";
        } else {
          alert("Hubo un error al enviar el formulario.");
        }
      } catch (error) {
        console.error(error);
        alert("No se pudo conectar con el servidor.");
      }
    } else {
      const links = {
        1: "https://www.mercadopago.com.ar/subscriptions/checkout?preapproval_plan_id=2c938084968c9eaa01969982254c05d0",
        2: "https://www.mercadopago.com.ar/subscriptions/checkout?preapproval_plan_id=2c938084968c9eaa01969982254c05d0",
        3: "https://www.mercadopago.com.ar/subscriptions/checkout?preapproval_plan_id=2c938084968c9eaa01969982254c05d0"
      };
      localStorage.setItem("datosForm", JSON.stringify(Object.fromEntries(formData)));
      window.location.href = links[plan] + "&back_url=" + encodeURIComponent(window.location.href + "&pago=ok");
    }
  });

  window.addEventListener("DOMContentLoaded", () => {
    const pagoOk = urlParams.get("pago") === "ok";
    if (pagoOk && plan > 0) {
      const datos = JSON.parse(localStorage.getItem("datosForm") || "{}");
      for (const [key, value] of Object.entries(datos)) {
        const campo = document.querySelector(`[name="${key}"]`);
        if (campo) campo.value = value;
      }

      const formData = new FormData(document.getElementById("formulario"));
      formData.append("plan", plan);

      fetch("https://script.google.com/macros/s/AKfycbzxrjlRDwP_GxVO7IrzVpLvEEJV93xUTtq6lKUp3-XLjX5ViLMnMwGc3dPMDYdltx57/exec", {
        method: "POST",
        body: formData
      }).then(() => {
        document.getElementById("contenido").style.display = "none";
        document.getElementById("mensajeFinal").style.display = "block";
        localStorage.removeItem("datosForm");
        const cleanUrl = window.location.href.replace(/([&?])pago=ok(&|$)/, '$1').replace(/\?$/, '');
        history.replaceState({}, document.title, cleanUrl);
      });
    }
  });
</script>

</body>
</html>
