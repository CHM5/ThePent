<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Formulario - Plan Base</title>
  <style>
    body { font-family: sans-serif; padding: 30px; max-width: 600px; margin: auto; }
    h1 { text-align: center; }
    label { display: block; margin-top: 15px; }
    input { width: 100%; padding: 10px; margin-top: 5px; }
    button {
      margin-top: 20px;
      padding: 12px 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Contratar Plan Base</h1>
  <form id="clienteForm">
    <label for="nombre">Nombre</label>
    <input type="text" id="nombre" name="nombre" required />

    <label for="apellido">Apellido</label>
    <input type="text" id="apellido" name="apellido" required />

    <label for="negocio">Nombre del Negocio</label>
    <input type="text" id="negocio" name="negocio" required />

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required />

    <button type="submit">Crear Menú</button>
  </form>

  <script>
    const queryParams = new URLSearchParams(window.location.search);
    const planSeleccionado = queryParams.get("plan");

    document.getElementById("clienteForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const datos = {
        nombre: document.getElementById("nombre").value,
        apellido: document.getElementById("apellido").value,
        negocio: document.getElementById("negocio").value,
        email: document.getElementById("email").value,
        plan: planSeleccionado
      };

      fetch("https://script.google.com/macros/s/AKfycbwJ1R1lHcg5HGR8bo40sKy88x7Z8ALY4lAbeiGGqk6Xplv-DNYHQpXhUAYKBUXoOpb-/exec", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datos)
      })

      .then(res => res.ok ? alert("Formulario enviado con éxito") : alert("Error al enviar"))
      .catch(err => {
        console.error("Error:", err);
        alert("Error al enviar los datos.");
      });
    });
  </script>
</body>
</html>
